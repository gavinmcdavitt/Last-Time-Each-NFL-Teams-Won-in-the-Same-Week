<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFL Top Weekly Fantasy Performances</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Style checkbox to match site */
        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #fff;
            font-size: 1.1rem;
            white-space: nowrap;
        }
        .checkbox-container input[type="checkbox"] {
            appearance: none;
            width: 24px;
            height: 24px;
            background: #222;
            border: 2px solid #d50a0a;
            border-radius: 6px;
            cursor: pointer;
            position: relative;
        }
        .checkbox-container input[type="checkbox"]:checked {
            background: #d50a0a;
        }
        .checkbox-container input[type="checkbox"]:checked::after {
            content: '✓';
            color: white;
            font-weight: bold;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .checkbox-container label {
            cursor: pointer;
        }

        /* Controls responsive on small screens */
        @media (max-width: 600px) {
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            .checkbox-container {
                justify-content: center;
                margin: 15px 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Top Weekly Fantasy Performances</h1>
        <p>Filter by position and team, then choose how many to see!</p>

        <div class="controls" style="display: flex; justify-content: center; align-items: center; gap: 20px; margin: 40px 0; flex-wrap: wrap;">
            <select id="position-filter">
                <option value="">All Positions</option>
                <option value="QB">Quarterback (QB)</option>
                <option value="RB">Running Back (RB)</option>
                <option value="WR">Wide Receiver (WR)</option>
                <option value="TE">Tight End (TE)</option>
            </select>

            <select id="team-filter">
                <option value="">All Teams</option>
                <!-- Filled by JS -->
            </select>

            <div class="checkbox-container">
                <input type="checkbox" id="single-checkbox">
                <label for="single-checkbox">Singular Performance</label>
            </div>

            <button id="show-btn">Show Performances</button>
            <button id="random-btn">Random Monster Game</button>
        </div>

        <div id="results"></div>
    </div>

    <script type="module" src="all_top100_weekly.js"></script>
    <script type="module" src="random_fantasy.js"></script>
</body>
</html>
